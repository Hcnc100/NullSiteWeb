<div class="container-animation">
  <div class="container-card-project">
    <img [src]="imageSource() || ''" [alt]="localizedText(project().coverAlt || project().name, project().translations, i18n.locale(), 'coverAlt')" width="180" height="180" loading="lazy" decoding="async" (error)="imageError()">
    <div class="container-title-project">
      <h2 class="project-title">{{localizedText(project().name, project().translations, i18n.locale(), 'name')}}</h2>
    </div>
  </div>

</div>
