<div class="container-form">
  <form (ngSubmit)="onSubmit()" [formGroup]="formContact" [attr.aria-busy]="isSending()">
    <fieldset [disabled]="isSending()" [class.is-sending]="isSending()">
    <div class="container-inputs">

      <!-- Input field for name -->
      <div class="form-section">
        <label for="contact-name">{{'Name' | t}}</label>
        <input id="contact-name" formControlName="name" autocomplete="name" required aria-describedby="contact-name-help"
          [attr.aria-invalid]="formContact.controls.name.touched && formContact.controls.name.invalid" type="text" [maxlength]="maxCountName+10">
        <app-count-and-error-field id="contact-name-help" [control]="formContact.controls.name" [errorsList]="errorsListName" [maxCount]="maxCountName">
        </app-count-and-error-field>
      </div>

      <!-- Input field for email -->
      <div class="form-section">
        <label for="contact-email">{{'Email' | t}}</label>
        <input id="contact-email" formControlName="email" autocomplete="email" required aria-describedby="contact-email-help"
          [attr.aria-invalid]="formContact.controls.email.touched && formContact.controls.email.invalid" type="email" [maxlength]="maxCountEmail+10">
        <div class="count-and-error">
          <app-count-and-error-field id="contact-email-help" [control]="formContact.controls.email" [errorsList]="errorsListEmail" [maxCount]="maxCountEmail">
          </app-count-and-error-field>
        </div>
      </div>

      <!-- Input field for subject -->
      <div class="form-section">
        <label for="contact-subject">{{'Subject' | t}}</label>
        <input id="contact-subject" formControlName="subject" required aria-describedby="contact-subject-help"
          [attr.aria-invalid]="formContact.controls.subject.touched && formContact.controls.subject.invalid" type="text" [maxlength]="maxCountSubject+10">
        <app-count-and-error-field id="contact-subject-help" [control]="formContact.controls.subject" [errorsList]="errorsListSubject"
          [maxCount]="maxCountSubject">
        </app-count-and-error-field>
      </div>
    </div>

    <!-- Textarea field for message -->
    <div class="form-section">
      <label for="contact-message">{{'Write your message' | t}}</label>
      <textarea id="contact-message" formControlName="message" required aria-describedby="contact-message-help"
        [attr.aria-invalid]="formContact.controls.message.touched && formContact.controls.message.invalid" [maxlength]="maxCountMessage+10"></textarea>
      <app-count-and-error-field id="contact-message-help" [control]="formContact.controls.message" [errorsList]="errorsListMessage"
        [maxCount]="maxCountMessage"></app-count-and-error-field>
    </div>

    <!-- reCAPTCHA field -->
    <ngx-recaptcha2 #captcha formControlName="token" [siteKey]="siteKey" [hl]="i18n.locale()" size="compact"></ngx-recaptcha2>

    <!-- Submit button -->
    <input type="submit" [disabled]="isSending() || formContact.disabled" [value]="(isSending() ? 'Sending message…' : 'Send Message') | t">
    </fieldset>
    <p class="submission-status" role="status" aria-live="polite">{{ (isSending() ? 'Sending message. Please wait without closing this page.' : '') | t }}</p>
    @if (submissionError()) {
      <p class="submission-error" role="alert">{{ submissionError() | t }}</p>
    }

  </form>
</div>
<dialog #sendingDialog class="sending-dialog" aria-labelledby="sending-dialog-title"
  aria-describedby="sending-dialog-description" (cancel)="preventSendingDismiss($event)">
  <div class="sending-spinner" aria-hidden="true"></div>
  <h2 id="sending-dialog-title">{{ 'Sending message…' | t }}</h2>
  <p id="sending-dialog-description">{{ 'Sending message. Please wait without closing this page.' | t }}</p>
</dialog>
