<div class="container-image-contact">
  @if (!isMobile()) {
    <div class="contact-text">
      <h2>{{"Contact me, let's talk for a while" | t}}</h2>
      <p>{{'I am open to any job proposal' | t}}</p>
    </div>
  } @else {
    <h2>{{'Contact' | t}}</h2>
  }


  <img alt="" src="assets/contact.svg" width="300" height="300" decoding="async">
</div>
