name: Validate and release Firebase
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/scripts/**'
      - '.github/workflows/deploy-firebase.yml'
      - '.github/workflows/rollback-retained.yml'
      - '.github/workflows/sync-retention.yml'
      - 'tests/release-workflow.test.mjs'
  pull_request:
  workflow_dispatch:
    inputs:
      accepted:
        description: 'Aceptación real completada y antispam backend resuelto'
        type: boolean
        default: false
      target:
        description: 'Alcance explícito (reglas afectan también al móvil)'
        type: choice
        options: [full, hosting]
        default: full
permissions:
  contents: read
concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test image retention safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_artifact_retention.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix functions-contact ci
      - run: npm --prefix functions-contact test
      - run: node --test tests/ci-environment.test.mjs tests/contact-config.test.mjs tests/release-workflow.test.mjs
      - run: node scripts/ci-environment.mjs
      - run: npx --no-install tsc --project tsconfig.spec.json --noEmit
      - run: npm test -- --watch=false
      - run: npx --yes firebase-tools@15.22.1 emulators:exec --config firebase.emulators.legal.json --project demo-nullsite-phase2 --only firestore,storage "node tests/firebase-rules.mjs && node functions-contact/test/quota-emulator.mjs"
      - run: npm run build -- --configuration production
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.accepted))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix functions-contact ci
      - name: Block release on high or critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm --prefix functions-contact audit --audit-level=high
      - name: Validate allowed origins for contact backend
        if: github.event_name == 'push' || inputs.target == 'full'
        run: node scripts/contact-config.mjs
        env:
          CONTACT_ALLOWED_ORIGINS: ${{ vars.CONTACT_ALLOWED_ORIGINS || secrets.CONTACT_ALLOWED_ORIGINS }}
      - name: Generate production configuration safely
        run: node scripts/ci-environment.mjs --production
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      - run: npm run build -- --configuration production
      - uses: google-github-actions/auth@v3
        with:
          project_id: nullpointer-716ae
          workload_identity_provider: projects/646388363945/locations/global/workloadIdentityPools/github-actions/providers/nullsiteweb
          service_account: github-actions-firebase@nullpointer-716ae.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Capture contact image before deployment
        if: github.event_name == 'push' || inputs.target == 'full'
        run: python3 .github/scripts/artifact_retention.py capture --project nullpointer-716ae --region us-central1 --service submitcontact --state "$RUNNER_TEMP/retention-contact.json"
      # Merges to main release the full stack only after validation succeeds.
      # Separate codebase prevents managing the legacy notification functions.
      - name: Release contact backend first
        if: github.event_name == 'push' || inputs.target == 'full'
        run: npx --yes firebase-tools@15.22.1 deploy --only functions:contact --project nullpointer-716ae --non-interactive
      - name: Protect active and previous contact image
        if: github.event_name == 'push' || inputs.target == 'full'
        run: python3 .github/scripts/artifact_retention.py sync --project nullpointer-716ae --region us-central1 --service submitcontact --state "$RUNNER_TEMP/retention-contact.json"
      - name: Release rules and frontend
        env:
          DEPLOY_TARGET: ${{ github.event_name == 'push' && 'full' || inputs.target }}
        run: |
          if [ "$DEPLOY_TARGET" = "full" ]; then
            npx --yes firebase-tools@15.22.1 deploy --only firestore:rules,firestore:indexes,storage,hosting --project nullpointer-716ae --non-interactive
          else
            # Only for later frontend-only updates after the full migration.
            npx --yes firebase-tools@15.22.1 deploy --only hosting --project nullpointer-716ae --non-interactive
          fi
