# .github/workflows/deploy-firebase.yml
name: Deploy Angular to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v5

      # Autenticación temporal sin llave JSON.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: nullpointer-716ae
          workload_identity_provider: projects/646388363945/locations/global/workloadIdentityPools/github-actions/providers/nullsiteweb
          service_account: github-actions-firebase@nullpointer-716ae.iam.gserviceaccount.com

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Cache de node_modules para acelerar builds
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 5️⃣ Generar archivos de environment dinámicamente
      - name: Setup Angular environments
        run: |
          mkdir -p src/environments

          # Archivo de desarrollo (placeholder)
          echo "export const environment = {
            production: false,
            siteKey: 'SITE_KEY_DEV_PLACEHOLDER',
            firebase: {
              apiKey: 'FIREBASE_API_KEY_DEV_PLACEHOLDER',
              authDomain: 'FIREBASE_AUTH_DOMAIN_DEV_PLACEHOLDER',
              projectId: 'FIREBASE_PROJECT_ID_DEV_PLACEHOLDER',
              storageBucket: 'FIREBASE_STORAGE_BUCKET_DEV_PLACEHOLDER',
              messagingSenderId: 'FIREBASE_MESSAGING_SENDER_ID_DEV_PLACEHOLDER',
              appId: 'FIREBASE_APP_ID_DEV_PLACEHOLDER',
              measurementId: 'FIREBASE_MEASUREMENT_ID'
            }
          };" > src/environments/environment.ts

          # Archivo de producción con secrets
          echo "export const environment = {
            production: true,
            siteKey: '${{ secrets.SITE_KEY }}',
            firebase: {
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
              measurementId: '${{ secrets.FIREBASE_MEASUREMENT_ID }}'
            }
          };" > src/environments/environment.prod.ts

      # 6️⃣ Build Angular en producción
      - name: Build Angular project (prod)
        run: npm run build -- --configuration production

      # 7️⃣ Deploy a Firebase Hosting con credenciales temporales.
      # Firebase CLI 15.22.2 tiene una regresión conocida con WIF;
      # se fija 15.22.1 hasta que la corrección esté disponible.
      - name: Deploy to Firebase Hosting
        run: >-
          npx --yes firebase-tools@15.22.1 deploy
          --only hosting
          --project nullpointer-716ae
          --non-interactive
